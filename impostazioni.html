<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apertura impostazioni…</title>
</head>
<body style="font-family:sans-serif;background:#0b1220;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
<p>Apertura impostazioni…</p>
<script>
  // File "ponte": serve solo per i browser (es. quello integrato di alcune LIM) che,
  // salvando un collegamento rapido, perdono il punto interrogativo di un URL come
  // "mesticandum.html?impostazioni". Qui invece il percorso non ha parametri: non c'è
  // nulla da perdere. Si lascia un segnale in sessionStorage e si torna alla pagina
  // principale, che lo legge e apre subito il pannello Impostazioni.
  try { sessionStorage.setItem("mestica_apri_impostazioni", "1"); } catch(e) {}
  location.replace("mesticandum.html");
</script>
</body>
</html>
